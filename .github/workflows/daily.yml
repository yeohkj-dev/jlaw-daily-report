name: 每日报告

on:
  schedule:
    # 平日版：美股收盘后 UTC 22:30，周一至周五（= 马来西亚/香港时间次日早上 6:30）
    - cron: "30 22 * * 1-5"
    # 周末版：周日 UTC 23:00（= 马来西亚/香港时间周一早上 7:00）：周末新闻 + 每周展望
    - cron: "0 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装中文字体和 matplotlib（画图用）
        timeout-minutes: 5
        run: |
          mkdir -p ~/.local/share/fonts
          curl -sSL --retry 3 -o ~/.local/share/fonts/NotoSansSC-Regular.otf \
            https://github.com/notofonts/noto-cjk/raw/main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf
          pip install -q matplotlib
          rm -rf ~/.cache/matplotlib

      # --strict：数据核对有严重问题时，这一步会失败、网站保留上一份报告，GitHub 会发邮件通知
      - name: 生成报告（大盘 / 选股 / 新闻 / 业绩估值 / 每周展望）
        run: python tools/jlaw_daily_report.py . --no-open --publish docs --strict

      - name: 保存结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A docs 大盘报告 每日选股 每周展望 业绩估值/cache
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -q -m "每日报告 $(date -u +%Y-%m-%d)"
            git push
          fi
