name: 每日报告

on:
  schedule:
    # 平日版：美股收盘后 UTC 22:30，周一至周五（= 马来西亚/香港时间次日早上 6:30）
    - cron: "30 22 * * 1-5"
    # 周末版：周日 UTC 23:30（= 马来西亚/香港时间周一早上 7:30；美东周日晚期货已开盘）：周末新闻 + 每周展望 + Telegram 周末版
    - cron: "30 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装中文字体和 matplotlib（画图用）
        timeout-minutes: 5
        run: |
          mkdir -p ~/.local/share/fonts
          curl -sSL --retry 3 -o ~/.local/share/fonts/NotoSansSC-Regular.otf \
            https://github.com/notofonts/noto-cjk/raw/main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf
          pip install -q matplotlib
          rm -rf ~/.cache/matplotlib

      # 量化系统：市场状态分 + 进出场信号 + 完整回测报告（docs/quant.html）
      # 个股数据（约 2,250 只 × 5 年）用 actions/cache 保存，平常每天只补最近几天
      - name: 恢复量化数据缓存
        uses: actions/cache@v4
        with:
          path: 量化/data
          key: quant-data-${{ github.run_id }}
          restore-keys: quant-data-

      - name: 量化系统（失败不影响其他报告，网站沿用上一份）
        continue-on-error: true
        timeout-minutes: 25
        run: |
          pip install -q yfinance pandas numpy
          python 量化/run.py

      # --strict：数据核对有严重问题时，这一步会失败、网站保留上一份报告，GitHub 会发邮件通知
      - name: 生成报告（大盘 / 选股 / 新闻 / 业绩估值 / 每周展望）
        run: python tools/jlaw_daily_report.py . --no-open --publish docs --strict

      # 早报发到 Telegram（只在报告成功发布后；同一份只发一次；发送失败不影响网站）
      - name: 发送早报到 Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tools/telegram_send.py .

      # 周末版（只有周日晚的周末运行才会产生新的一份；同一份只发一次）
      - name: 发送周末版到 Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tools/telegram_send.py . --weekend

      - name: 保存结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A docs 大盘报告 每日选股 每周展望 业绩估值/cache 新闻 Luk选股 早报
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -q -m "每日报告 $(date -u +%Y-%m-%d)"
            git push
          fi
